[build-system]
requires = ["maturin>=1.0,<2.0"]
build-backend = "maturin"

[tool.maturin]
features = ["pyo3/extension-module"]

[package]
name = "feagi_rust_py_libs"
version = "0.0.100"
edition = "2021"
rust-version = "1.87"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html
[lib]
name = "feagi_rust_py_libs"
crate-type = ["cdylib"]

# FEAGI crates.
#
# DEV-ONLY OVERRIDE: while feagi-core 0.0.10 is unpublished, the `path = ...`
# entries pin every direct feagi-* dep to the local in-tree workspace under
# `../feagi-core/crates/...`. Cargo prefers `path` over `version` when both are
# present, so this re-routes the entire feagi-* dependency graph to local
# sources without touching crates.io. Once 0.0.10 is published the `path =`
# entries can be deleted and the version pins alone become the source of truth.
[dependencies]
# Unify to zune-jpeg 0.5.8 (0.5.7 fails on Rust 1.78+ target_feature/unsafe; 0.5.8 requires Rust 1.87)
zune-jpeg = "0.5.8"
feagi-agent = { version = "0.0.10", path = "../feagi-core/crates/feagi-agent", features = ["agent-client-asynchelper-tokio"] }
feagi-io = { version = "0.0.10", path = "../feagi-core/crates/feagi-io" }
feagi-sensorimotor = { version = "0.0.10", path = "../feagi-core/crates/feagi-sensorimotor" }
feagi-serialization = { version = "0.0.10", path = "../feagi-core/crates/feagi-serialization" }
feagi_data_structures = { package = "feagi-structures", version = "0.0.10", path = "../feagi-core/crates/feagi-structures" }
feagi-evolutionary = { version = "0.0.10", path = "../feagi-core/crates/feagi-evolutionary" }
numpy = "0.27.1"
ndarray = "0.17"
paste = "1.0.15"
serde_json = "1.0.145"
base64 = "0.22.1"
tracing = "0.1.43"
tracing-subscriber = { version = "0.3.22", features = ["env-filter"] }
tokenizers = "0.15.2"
heck = "0.5"


[build-dependencies]
# Mirrors the dev-only override above so build scripts also resolve against
# local feagi-core 0.0.10 instead of the published 0.0.9.
feagi_data_structures = { package = "feagi-structures", version = "0.0.10", path = "../feagi-core/crates/feagi-structures" }
heck = "0.5"

[dependencies.pyo3]
version = "0.27.2"
features = ["abi3-py38", "multiple-pymethods"] # "abi3-py38" tells pyo3 (and maturin) to rust_build_scripts using the stable ABI with minimum Python version 3.8


