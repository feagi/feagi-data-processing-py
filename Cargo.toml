[build-system]
requires = ["maturin>=1.0,<2.0"]
build-backend = "maturin"

[tool.maturin]
features = ["pyo3/extension-module"]

[package]
name = "feagi_rust_py_libs"
version = "0.0.96"
edition = "2021"
rust-version = "1.87"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html
[lib]
name = "feagi_rust_py_libs"
crate-type = ["cdylib"]

# FEAGI crates (crates.io; align with feagi-core [workspace.package] 0.0.9).
[dependencies]
# Unify to zune-jpeg 0.5.8 (0.5.7 fails on Rust 1.78+ target_feature/unsafe; 0.5.8 requires Rust 1.87)
zune-jpeg = "0.5.8"
feagi-agent = { version = "0.0.9" }
feagi-io = { version = "0.0.9" }
feagi-sensorimotor = { version = "0.0.9" }
feagi-serialization = { version = "0.0.9" }
feagi_data_structures = { package = "feagi-structures", version = "0.0.9" }
feagi-evolutionary = { version = "0.0.9" }
numpy = "0.27.1"
ndarray = "0.17"
paste = "1.0.15"
serde_json = "1.0.145"
base64 = "0.22.1"
tracing = "0.1.43"
tracing-subscriber = { version = "0.3.22", features = ["env-filter"] }
tokenizers = "0.15.2"
heck = "0.5"


[build-dependencies]
feagi_data_structures = { package = "feagi-structures", version = "0.0.9" }
heck = "0.5"

[dependencies.pyo3]
version = "0.27.2"
features = ["abi3-py38", "multiple-pymethods"] # "abi3-py38" tells pyo3 (and maturin) to rust_build_scripts using the stable ABI with minimum Python version 3.8


