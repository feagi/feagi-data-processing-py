[build-system]
requires = ["maturin>=1.0,<2.0"]
build-backend = "maturin"

[tool.maturin]
features = ["pyo3/extension-module"]

[package]
name = "feagi_rust_py_libs"
version = "0.0.102"
edition = "2021"
rust-version = "1.87"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html
[lib]
name = "feagi_rust_py_libs"
crate-type = ["cdylib"]

# FEAGI crates — resolve from crates.io (feagi-core release line). Use caret
# pins so compatible patch releases update with `cargo update`.
[dependencies]
# Unify to zune-jpeg 0.5.8 (0.5.7 fails on Rust 1.78+ target_feature/unsafe; 0.5.8 requires Rust 1.87)
zune-jpeg = "0.5.8"
# Transitive via feagi crates; 0.25.10+ requires rustc 1.88 while crate rust-version is 1.87.
image = ">=0.25.8, <0.25.10"
feagi-agent = { version = "^0.0.11", features = ["agent-client-asynchelper-tokio"] }
feagi-io = "^0.0.11"
feagi-sensorimotor = "^0.0.11"
feagi-serialization = "^0.0.11"
feagi_data_structures = { package = "feagi-structures", version = "^0.0.11" }
feagi-evolutionary = "^0.0.11"
numpy = "0.27.1"
ndarray = "0.17"
paste = "1.0.15"
serde_json = "1.0.145"
base64 = "0.22.1"
tracing = "0.1.43"
tracing-subscriber = { version = "0.3.22", features = ["env-filter"] }
tokenizers = "0.15.2"
heck = "0.5"


[build-dependencies]
feagi_data_structures = { package = "feagi-structures", version = "^0.0.11" }
heck = "0.5"

[dependencies.pyo3]
version = "0.27.2"
features = ["abi3-py38", "multiple-pymethods"] # "abi3-py38" tells pyo3 (and maturin) to rust_build_scripts using the stable ABI with minimum Python version 3.8


